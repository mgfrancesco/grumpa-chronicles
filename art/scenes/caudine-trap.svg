<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Iowan Old Style, Palatino, Georgia, serif" role="img" aria-label="Diagram of the trap at the Caudine Forks as Livy describes it">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b2d20"/></marker>
  </defs>
  <rect width="760" height="440" fill="#f1e7cf"/>

  <!-- the plain between the defiles: grassy and well watered (9.2.7) -->
  <path d="M150 150 Q380 118 610 168 L610 292 Q380 330 150 286 Z" fill="#e2e1bb"/>
  <g stroke="#9aa267" stroke-width="1.4">
    <path d="M200 175v-8M206 176v-6M260 160v-8M266 161v-6M470 160v-8M476 161v-6M540 175v-8M546 176v-6M220 270v-8M226 271v-6M520 285v-8M526 286v-6M470 250v-8M476 251v-6"/>
  </g>
  <path d="M300 286 Q360 280 420 288 Q470 294 520 290" fill="none" stroke="#6f8fa3" stroke-width="4" stroke-linecap="round"/>

  <!-- mountains all round, joined from one defile to the other (9.2.7) -->
  <path d="M0 0H760V180 Q720 176 690 196 L610 168 Q520 120 450 112 Q380 92 300 112 Q220 118 150 150 L130 166 Q60 150 0 166Z" fill="#d9c08f"/>
  <path d="M0 440H760V230 Q720 240 690 218 L610 292 Q520 334 420 332 Q300 338 220 312 Q180 300 150 286 L130 270 Q60 286 0 270Z" fill="#d9c08f"/>
  <g fill="none" stroke="#b98a3e" stroke-width="1.6">
    <path d="M230 90l32-50 32 50M340 70l34-52 34 52M460 80l30-46 30 46"/>
    <path d="M300 410l30-40 30 40M430 410l30-40 30 40"/>
  </g>

  <!-- the first defile, by which the Romans entered -->
  <path d="M0 166 Q60 150 130 166 L150 150 L150 286 L130 270 Q60 286 0 270Z" fill="#ead9b4"/>
  <!-- the second, narrower and harder defile at the far end (9.2.8) -->
  <path d="M610 168 L690 196 Q720 176 760 180 V230 Q720 240 690 218 L610 292 Z" fill="#ead9b4"/>
  <path d="M640 196 L760 196 V214 L640 214Z" fill="#e4cfa4"/>

  <!-- barricade of felled trees and heaped rock at the far exit (9.2.9) -->
  <g transform="translate(660 205)">
    <path d="M-26 -14L22 12M-24 10L24 -12M-30 0H30" stroke="#5b3d24" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-14" cy="14" r="8" fill="#9a8f80"/><circle cx="6" cy="16" r="9" fill="#8a7f70"/><circle cx="22" cy="12" r="7" fill="#9a8f80"/>
  </g>
  <!-- the way back, closed with its own barrier and armed men (9.2.10); Livy does not describe it -->
  <g transform="translate(62 218)" stroke="#5b3d24" stroke-width="4" stroke-linecap="round">
    <path d="M-20 -26v52M-8 -26v52M4 -26v52M16 -26v52M-26 -10h48M-26 10h48"/>
  </g>
  <!-- Samnite posts on the heights -->
  <g fill="#9b2d20">
    <g transform="translate(670 150)"><path d="M-10 12L10 -18" stroke="#3a2a1e" stroke-width="2"/><circle r="8" fill="#9b2d20" stroke="#f1e7cf" stroke-width="2"/></g>
    <g transform="translate(700 262)"><path d="M-10 12L10 -18" stroke="#3a2a1e" stroke-width="2"/><circle r="8" fill="#9b2d20" stroke="#f1e7cf" stroke-width="2"/></g>
    <g transform="translate(96 196)"><path d="M-10 12L10 -18" stroke="#3a2a1e" stroke-width="2"/><circle r="8" fill="#9b2d20" stroke="#f1e7cf" stroke-width="2"/></g>
    <g transform="translate(96 244)"><path d="M-10 12L10 -18" stroke="#3a2a1e" stroke-width="2"/><circle r="8" fill="#9b2d20" stroke="#f1e7cf" stroke-width="2"/></g>
  </g>

  <!-- Roman camp, ramparted beside the water (9.2.13) -->
  <rect x="352" y="236" width="54" height="36" fill="#f6efe0" stroke="#3a2a1e" stroke-width="2.5"/>
  <path d="M352 254h54M379 236v36" stroke="#3a2a1e" stroke-width="1"/>

  <!-- the march: in, to the far exit, and back -->
  <path d="M20 192 Q200 172 600 186" fill="none" stroke="#9b2d20" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M600 210 Q330 214 120 216" fill="none" stroke="#9b2d20" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ah)"/>

  <g font-size="22" fill="#3a2a1e">
    <text x="380" y="165" text-anchor="middle" font-style="italic">campus herbidus aquosusque</text>
    <text x="380" y="318" text-anchor="middle" font-size="21">Roman camp, by the water</text>
    <text x="20" y="128" font-size="21">first defile: the way in</text>
    <text x="740" y="104" text-anchor="end" font-size="21">second, narrower defile</text>
    <text x="740" y="350" text-anchor="end" font-size="21" fill="#9b2d20">felled trees, heaped rock;</text>
    <text x="740" y="376" text-anchor="end" font-size="21" fill="#9b2d20">a guard on the height</text>
    <text x="20" y="350" font-size="21" fill="#9b2d20">the way back: a barrier, armed men</text>
  </g>
  <text x="380" y="425" text-anchor="middle" font-size="18" font-style="italic" fill="#5b5047">A diagram of Livy 9.2.7–13, not a survey of the ground.</text>
</svg>
