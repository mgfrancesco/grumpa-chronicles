<text x="396" y="176" font-size="21" fill="#3a2a1e" text-anchor="start">Decius, devotus</text>
<text x="24" y="252" font-size="21" fill="#3a2a1e" text-anchor="start">The Roman horse is carried in among the foot; chariots</text>
<text x="24" y="278" font-size="21" fill="#3a2a1e" text-anchor="start">and wagons scatter it and it breaks its own front ranks.</text>
<text x="24" y="304" font-size="21" fill="#3a2a1e" text-anchor="start">Decius devotes himself and the enemy, rides where</text>
<text x="24" y="330" font-size="21" fill="#3a2a1e" text-anchor="start">the Gauls are thickest and is killed.</text>
</g>
