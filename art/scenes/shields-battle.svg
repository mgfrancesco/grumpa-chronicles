<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Iowan Old Style, Palatino, Georgia, serif" role="img" aria-label="Diagram of the battle of the gilded shields as Livy describes it: the two lines, the wings and their commanders, and the order of the attacks">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b2d20"/></marker>
    <pattern id="eq" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#efd9cf"/><path d="M0 0V10" stroke="#9b2d20" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="760" height="640" fill="#f1e7cf"/>

  <!-- Samnite line (9.40.3, 9.40.9): silvered men and sacrati in white on their right, gilded on their left -->
  <text x="380" y="34" text-anchor="middle" font-size="23" fill="#3a2a1e">Samnites</text>
  <g font-size="20" fill="#3a2a1e" text-anchor="middle" font-style="italic">
    <text x="255" y="70">cornu dextrum</text>
    <text x="505" y="70">cornu sinistrum</text>
  </g>
  <rect x="140" y="82" width="230" height="74" fill="#f7f6f1" stroke="#6e7377" stroke-width="3"/>
  <rect x="390" y="82" width="230" height="74" fill="#d6aa45" stroke="#6b4a1e" stroke-width="3"/>
  <g font-size="20" fill="#3a2a1e" text-anchor="middle">
    <text x="255" y="112">argentati;</text>
    <text x="255" y="138">sacrati, candida veste</text>
    <text x="505" y="112">aurati,</text>
    <text x="505" y="138">tunicae versicolores</text>
  </g>

  <!-- Roman line (9.40.7, 9.40.12): Iunius on the left, the dictator on the right, horse on the wings -->
  <rect x="140" y="338" width="230" height="64" fill="#efd9cf" stroke="#9b2d20" stroke-width="3"/>
  <rect x="390" y="338" width="230" height="64" fill="#efd9cf" stroke="#9b2d20" stroke-width="3"/>
  <rect x="44" y="338" width="84" height="64" fill="url(#eq)" stroke="#9b2d20" stroke-width="3"/>
  <rect x="632" y="338" width="84" height="64" fill="url(#eq)" stroke="#9b2d20" stroke-width="3"/>
  <g font-size="20" fill="#3a2a1e" text-anchor="middle">
    <text x="255" y="365">C. Iunius,</text>
    <text x="255" y="390">magister equitum</text>
    <text x="505" y="365">L. Papirius,</text>
    <text x="505" y="390">dictator</text>
  </g>
  <g font-size="20" fill="#3a2a1e" text-anchor="middle" font-style="italic">
    <text x="255" y="428">cornu laevum</text>
    <text x="505" y="428">cornu dextrum</text>
    <text x="86" y="428">equites</text>
    <text x="674" y="428">equites</text>
  </g>
  <g font-size="20" fill="#3a2a1e" text-anchor="middle">
    <text x="86" y="453">P. Decius</text>
    <text x="674" y="453">M. Valerius</text>
  </g>
  <text x="380" y="482" text-anchor="middle" font-size="23" fill="#3a2a1e">Romani</text>

  <!-- 1: Iunius moves first against the Samnite right (9.40.9) -->
  <path d="M255 334 V166" stroke="#9b2d20" stroke-width="5" marker-end="url(#ah)"/>
  <!-- 2: the dictator drives on his own wing (9.40.10–11) -->
  <path d="M505 334 V166" stroke="#9b2d20" stroke-width="5" stroke-dasharray="12 7" marker-end="url(#ah)"/>
  <!-- 3: the legates lead the horse into the flanks (9.40.12) -->
  <path d="M86 334 C70 260 80 170 132 140" fill="none" stroke="#9b2d20" stroke-width="4" marker-end="url(#ah)"/>
  <path d="M674 334 C690 260 680 170 628 140" fill="none" stroke="#9b2d20" stroke-width="4" marker-end="url(#ah)"/>

  <g font-size="22" fill="#f1e7cf" text-anchor="middle" font-weight="bold">
    <circle cx="225" cy="250" r="16" fill="#9b2d20"/><text x="225" y="258">1</text>
    <circle cx="475" cy="250" r="16" fill="#9b2d20"/><text x="475" y="258">2</text>
    <circle cx="46" cy="250" r="16" fill="#9b2d20"/><text x="46" y="258">3</text>
    <circle cx="714" cy="250" r="16" fill="#9b2d20"/><text x="714" y="258">3</text>
  </g>

  <g font-size="20" fill="#3a2a1e">
    <text x="30" y="522">1  Iunius moves first and drives in the Samnite right.</text>
    <text x="30" y="548">2  The dictator drives on his own wing.</text>
    <text x="30" y="574">3  Decius and Valerius take the horse into both flanks.</text>
    <text x="30" y="600">4  The legions press on with a fresh shout; the Samnites break.</text>
  </g>
  <text x="380" y="629" text-anchor="middle" font-size="19" font-style="italic" fill="#5b5047">A diagram of Livy 9.40.3–13, not a plan of the field.</text>
</svg>
